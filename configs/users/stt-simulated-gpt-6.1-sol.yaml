# gpt-6.1-sol as the caller simulator with simulated phone STT: the caller writes SAID and HEARD
# under the stt-simulated-gpt-6.1-sol profile (src/callm/asr_profiles/), tuned for gpt-6.1-sol on
# real caller transcripts. Recognizer draws are on, so each caller turn's outcome follows the
# measured real rates. The agent only receives HEARD.
#   gym env start "+config_paths=[configs/gpt41.yaml,configs/users/stt-simulated-gpt-6.1-sol.yaml]"
user_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://api.openai.com/v1
      openai_api_key: ${oc.env:OPENAI_API_KEY}
      openai_model: gpt-6.1-sol

callm_resources_server:
  resources_servers:
    callm:
      user_temperature: false
      asr_profile: stt-simulated-gpt-6.1-sol
