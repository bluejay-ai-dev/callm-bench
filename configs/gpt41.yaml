# gpt-4.1 (OpenAI) as the model under test; caller pinned to gpt-5.2 unless a configs/users/ file is layered.
# Needs OPENAI_API_KEY.
config_paths:
  - resources_servers/micol/configs/micol.yaml

policy_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://api.openai.com/v1
      openai_api_key: ${oc.env:OPENAI_API_KEY}
      openai_model: gpt-4.1

user_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://api.openai.com/v1
      openai_api_key: ${oc.env:OPENAI_API_KEY}
      openai_model: gpt-5.2
